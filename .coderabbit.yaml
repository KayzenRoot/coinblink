# Repository-level GitOps configuration for the already installed CodeRabbit app.
# Preserve inherited organization review guidance and tools; override only review triggers.
inheritance: true

reviews:
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords:
      - "[skip review]"
