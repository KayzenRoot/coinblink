name: CoinBlink build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coinblink-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
