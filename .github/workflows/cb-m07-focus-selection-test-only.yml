name: CB M07 focus selection RED test-only (LOCAL)
on:
  push:
    branches:
      - test/cb-m07-focus-selection-intent-001
    paths:
      - test/modules/CB-M07/local-focus-selection-browser.test.mjs
      - src/modules/CB-M05/p1c-local/local-cms-ui.mjs
      - .github/workflows/cb-m07-focus-selection-test-only.yml
permissions:
  contents: read
concurrency:
  group: cb-m07-focus-selection-test-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-regression:
    name: M07 focus selection Chromium / D1 LOCAL / synthetic WebAuthn
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Public build
        run: npm run build
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Focus/selection integrated real D1 virtual WebAuthn regression
        run: node --test test/modules/CB-M07/local-focus-selection-browser.test.mjs
