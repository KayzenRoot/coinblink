name: Cloudflare production main-only

on:
  workflow_run:
    workflows: ["GEF validation"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coinblink-cloudflare-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify trusted main SHA and required checks
    if: github.repository == 'KayzenRoot/coinblink'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      main_sha: ${{ steps.eligibility.outputs.main_sha }}
      source_pr: ${{ steps.eligibility.outputs.source_pr }}
    steps:
      - name: Check out trusted default-branch guard code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up pinned Node.js and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0

      - name: Verify the completed GEF run, exact main SHA, merged source tree, and checks
        id: eligibility
        run: node scripts/assert-production-deploy-eligibility.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    name: Build and deploy the exact eligible main SHA
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      deployments: write
      issues: read
    environment:
      name: production
      url: https://coinblink-production.kayzendev.workers.dev
    env:
      EXPECTED_MAIN_SHA: ${{ needs.preflight.outputs.main_sha }}
      EXPECTED_SHA: ${{ needs.preflight.outputs.main_sha }}
      SOURCE_PULL_REQUEST: ${{ needs.preflight.outputs.source_pr }}
      COINBLINK_CF_WORKER_NAME: coinblink-production
      COINBLINK_CF_WORKER_URL: https://coinblink-production.kayzendev.workers.dev
      GITHUB_ENVIRONMENT: production
      PUBLIC_BUILD_SHA: ${{ needs.preflight.outputs.main_sha }}
      PUBLIC_BUILD_ENV: production
    steps:
      - name: Check out the exact main commit admitted by preflight
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Verify exact checked-out main commit
        run: node scripts/verify-exact-head.mjs
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.main_sha }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck Astro and TypeScript
        run: npm run typecheck

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run unit, build, browser, accessibility, and GEF checks
        run: npm test

      - name: Reassert the Worker has no Astro session binding
        run: node scripts/assert-no-session-binding.mjs

      - name: Validate generated Worker bundle and fixed deployment target without publishing
        run: ./node_modules/.bin/wrangler deploy --dry-run --config ./dist/server/wrangler.json --name "$COINBLINK_CF_WORKER_NAME"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Recheck current main immediately before the Cloudflare deployment
        run: node scripts/assert-production-main-current.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy only the fixed production Worker from exact main
        run: |
          node scripts/assert-production-deployment-config.mjs
          ./node_modules/.bin/wrangler deploy --config ./dist/server/wrangler.json --name "$COINBLINK_CF_WORKER_NAME"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify exact-SHA production health and demo-only routes
        run: node scripts/verify-worker-production.mjs

      - name: Record verified deployment evidence
        if: success()
        run: |
          printf '\n### Cloudflare production deployment\n\n- Worker: `%s`\n- URL: %s\n- Main SHA: `%s`\n- Source PR: #%s\n- Checks: main exact-SHA 5/5 plus merged source PR 7/7 on an identical tree\n- Result: exact-SHA health, demo-only state, security headers, robots/noindex, and 404 verified\n' "$COINBLINK_CF_WORKER_NAME" "$COINBLINK_CF_WORKER_URL" "$EXPECTED_MAIN_SHA" "$SOURCE_PULL_REQUEST" >> "$GITHUB_STEP_SUMMARY"
        shell: bash
