name: Cloudflare production deploy
# Deploys the exact commit that lands on main. Nothing is published from a pull
# request: the credential exists only for this workflow and only on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coinblink-cloudflare-production
  cancel-in-progress: false
env:
  WRANGLER_SEND_METRICS: "false"
jobs:
  deploy:
    name: Build and deploy main to Cloudflare Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the exact pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Node 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Verify the deployment credentials exist before building
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=Missing secret::Set the CLOUDFLARE_API_TOKEN secret (Settings -> Secrets and variables -> Actions). See docs/automation/CLOUDFLARE_DEPLOYMENT.md"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=Missing account id::Set CLOUDFLARE_ACCOUNT_ID as a secret or a variable. See docs/automation/CLOUDFLARE_DEPLOYMENT.md"
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build for production
        env:
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          PUBLIC_BUILD_ENV: production
          # When this variable is set, the build emits canonical, hreflang
          # alternates and og:image for the deployed origin. Empty keeps every
          # absolute URL out of the build.
          PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
          # Off unless the owner sets the variable; see docs/product/CB-M04-P1-LIVE-ADAPTER-001.md
          PUBLIC_MARKET_LIVE: ${{ vars.PUBLIC_MARKET_LIVE }}
          # Headlines from keyless public RSS. Off unless set; see
          # docs/product/CB-M03-P1-LIVE-RSS-001.md
          PUBLIC_NEWS_LIVE: ${{ vars.PUBLIC_NEWS_LIVE }}
        run: npm run build
      - name: Reassert the Worker carries no session binding
        run: node scripts/assert-no-session-binding.mjs
      - name: Validate the generated Worker bundle without publishing
        run: ./node_modules/.bin/wrangler deploy --dry-run --config ./dist/server/wrangler.json --name "$COINBLINK_CF_WORKER_NAME"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          COINBLINK_CF_WORKER_NAME: ${{ vars.COINBLINK_CF_WORKER_NAME || 'coinblink-production' }}
      - name: Deploy the fixed production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          COINBLINK_CF_WORKER_NAME: ${{ vars.COINBLINK_CF_WORKER_NAME || 'coinblink-production' }}
        run: ./node_modules/.bin/wrangler deploy --config ./dist/server/wrangler.json --name "$COINBLINK_CF_WORKER_NAME"
      - name: Smoke test the deployed Worker
        if: vars.COINBLINK_CF_WORKER_URL != ''
        env:
          COINBLINK_CF_WORKER_URL: ${{ vars.COINBLINK_CF_WORKER_URL }}
          PUBLIC_NEWS_LIVE: ${{ vars.PUBLIC_NEWS_LIVE }}
        run: |
          node --input-type=module -e '
            const base = process.env.COINBLINK_CF_WORKER_URL.replace(/\/+$/u, "");
            const expectedSha = process.env.GITHUB_SHA;
            // Cloudflare can keep serving the previous version for a short
            // window right after `wrangler deploy`, so wait for this exact
            // commit before asserting anything else.
            async function waitForDeployedSha() {
              const deadline = Date.now() + 90_000;
              let last = "unknown";
              while (Date.now() < deadline) {
                try {
                  const health = await (await fetch(base + "/health", { cache: "no-store" })).json();
                  last = health.buildSha;
                  if (last === expectedSha) return health;
                } catch (error) {
                  last = "error: " + error.message;
                }
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
              throw new Error(`/health reports ${last}, expected the deployed commit ${expectedSha} within 90s`);
            }
            const health = await waitForDeployedSha();
            const checks = ["/health", "/en", "/demo", "/demo/intake", "/en/news/live", "/pt-br/news/live", "/es/news/live", "/en/news/source/coindesk", "/en/news/sources", "/demo/pulse", "/v1/sources"];
            for (const path of checks) {
              const response = await fetch(base + path, { redirect: "manual" });
              if (response.status !== 200) {
                throw new Error(`${path} answered ${response.status}, expected 200`);
              }
            }
            // The live-news switch must be observable, not assumed. Enabled may
            // still read as unavailable when every publisher is down, but it
            // must never look disabled.
            const news = await (await fetch(base + "/en/news/live")).text();
            const enabled = /^(1|true|enabled|on)$/iu.test((process.env.PUBLIC_NEWS_LIVE ?? "").trim());
            const state = enabled ? /data-m03-live="(live|unavailable)"/u : /data-m03-live="disabled"/u;
            if (!state.test(news)) {
              throw new Error("/en/news/live does not reflect PUBLIC_NEWS_LIVE=" + process.env.PUBLIC_NEWS_LIVE);
            }
            const statusResponse = await fetch(base + "/v1/news/status", { redirect: "manual" });
            if (statusResponse.status !== 200) {
              throw new Error("/v1/news/status answered " + statusResponse.status + ", expected 200");
            }
            const statusPayload = await statusResponse.json();
            if (!["ok", "disabled", "unavailable"].includes(statusPayload.status)) {
              throw new Error("/v1/news/status reported unknown state " + statusPayload.status);
            }
            if (typeof statusPayload.stale !== "boolean" || !Array.isArray(statusPayload.feeds) || statusPayload.feeds.some((feed) => "title" in feed)) {
              throw new Error("/v1/news/status must expose feed state without headline text");
            }
            // A shared edge cache can still hold the pre-deploy catalog for a
            // short window. Poll with revalidation until the new ETag appears.
            let catalog = null;
            let catalogEtag = "";
            const catalogDeadline = Date.now() + 90_000;
            while (Date.now() < catalogDeadline) {
              const response = await fetch(base + "/v1/sources", { headers: { "cache-control": "no-cache" } });
              catalogEtag = response.headers.get("etag") ?? "";
              catalog = await response.json();
              if (catalogEtag) break;
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            if (!catalogEtag) {
              throw new Error("/v1/sources must return an ETag within 90s");
            }
            const catalogCached = await fetch(base + "/v1/sources", { headers: { "if-none-match": catalogEtag, "cache-control": "no-cache" } });
            if (catalogCached.status !== 304) {
              throw new Error("/v1/sources must answer 304 for a matching ETag, got " + catalogCached.status);
            }
            if (catalog.count !== 5 || !Array.isArray(catalog.sources) || catalog.sources.length !== 5) {
              throw new Error("/v1/sources must list the five publishers");
            }
            if (catalog.sources.some((source) => "title" in source || "summary" in source)) {
              throw new Error("/v1/sources must stay metadata-only");
            }
            const home = await fetch(base + "/en");
            if (!/noindex, nofollow, noarchive/u.test(await home.text())) {
              throw new Error("/en is missing the demo robots policy");
            }
            const admin = await fetch(base + "/admin", { redirect: "manual" });
            if (admin.status < 400) throw new Error("/admin must stay unreachable in production");
            console.log("Smoke test passed for " + base + " at " + health.buildSha);
          '
      - name: Record the deployment in the run summary
        env:
          COINBLINK_CF_WORKER_NAME: ${{ vars.COINBLINK_CF_WORKER_NAME || 'coinblink-production' }}
          COINBLINK_CF_WORKER_URL: ${{ vars.COINBLINK_CF_WORKER_URL }}
        run: |
          {
            echo ""
            echo "### Cloudflare production deployment"
            echo ""
            echo "- Worker: \`${COINBLINK_CF_WORKER_NAME}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [ -n "${COINBLINK_CF_WORKER_URL}" ]; then
              echo "- Smoke test: passed against ${COINBLINK_CF_WORKER_URL}"
            else
              echo "- Smoke test: skipped because the COINBLINK_CF_WORKER_URL variable is not set"
            fi
            echo "- Scope: DEMO only. No publication, no rights clearance, no real accounts."
          } >> "$GITHUB_STEP_SUMMARY"
