name: CoinBlink ECC offline validation (synthetic)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.agents/skills/ecc-*/**'
      - 'tools/benchmarks/ecc-coinblink/**'
      - '.github/workflows/ecc-offline-validation.yml'

# Public-repository runners, no installs, secrets, agents, judges, deploys or external services.
permissions:
  contents: read

jobs:
  python:
    name: ECC offline / Python contracts (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate four skills, 18 NOT_RUN entries and synthetic Python telemetry
        run: python3 -m unittest discover -s tools/benchmarks/ecc-coinblink/validation -p 'test_*.py' -v

  windows:
    name: ECC offline / PowerShell isolation (Windows)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate Python collector on Windows with synthetic fixtures
        shell: pwsh
        run: python -m unittest discover -s tools/benchmarks/ecc-coinblink/validation -p 'test_*.py' -v
      - name: Validate synthetic A/B workspace isolation and quarantine
        shell: pwsh
        run: ./tools/benchmarks/ecc-coinblink/validation/Invoke-OfflineSelfTest.ps1

  sonar_annotations:
    name: ECC diagnostics / pinned Sonar annotations (read-only)
    if: github.event.pull_request.number == 209
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Extract verified historical SonarCloud check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PINNED_HEAD: ca2e9a9a82e815925daf3124b2124dbd0ed25a8a
          PINNED_CHECK_ID: '120381125906'
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/check-runs/$PINNED_CHECK_ID" \
            | python3 -c '
          import json, os, sys
          data=json.load(sys.stdin)
          if (data.get("head_sha") != os.environ["PINNED_HEAD"]
              or data.get("name") != "SonarCloud Code Analysis"
              or data.get("output",{}).get("annotations_count") != 5):
              sys.exit("STOP: pinned check identity or annotation count mismatch")
          print("PINNED_SONAR_CHECK_VERIFIED",data.get("head_sha"),data.get("output",{}).get("annotations_count"))
          '
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/check-runs/$PINNED_CHECK_ID/annotations?per_page=100" \
            | python3 -c '
          import json,sys
          items=json.load(sys.stdin)
          if len(items)!=5:sys.exit("STOP: expected exactly five annotations")
          fields=("path","start_line","end_line","annotation_level","title","message","raw_details")
          for i,item in enumerate(items,1):
              clean={key:item.get(key) for key in fields}
              print("PINNED_SONAR_ISSUE_"+str(i)+" "+json.dumps(clean,sort_keys=True,ensure_ascii=False))
          '
