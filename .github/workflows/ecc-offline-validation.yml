name: CoinBlink ECC offline validation (synthetic)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.agents/skills/ecc-*/**'
      - 'tools/benchmarks/ecc-coinblink/**'
      - '.github/workflows/ecc-offline-validation.yml'

# Public-repository runners, no installs, secrets, agents, judges, deploys or external services.
permissions:
  contents: read

jobs:
  python:
    name: ECC offline / Python contracts (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate four skills, 18 NOT_RUN entries and synthetic Python telemetry
        run: python3 -m unittest discover -s tools/benchmarks/ecc-coinblink/validation -p 'test_*.py' -v
      - name: Measure stdlib Python executable-line coverage in synthetic subprocesses
        run: python3 tools/benchmarks/ecc-coinblink/validation/measure_python_coverage.py

  windows:
    name: ECC offline / PowerShell isolation (Windows)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate Python collector on Windows with synthetic fixtures
        shell: pwsh
        run: python -m unittest discover -s tools/benchmarks/ecc-coinblink/validation -p 'test_*.py' -v
      - name: Validate synthetic A/B workspace isolation and quarantine
        shell: pwsh
        run: ./tools/benchmarks/ecc-coinblink/validation/Invoke-OfflineSelfTest.ps1

  sonar_pinned_diagnostic:
    name: ECC read-only / inspect two pinned Sonar annotations
    if: github.event.pull_request.number == 209
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Read historical check annotations without writing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PIN_SHA: 8e40c0656246817d2e9c7a6889e3fcec7dc509df
          PIN_CHECK: '120478421138'
        run: |
          set -euo pipefail
          gh api "/repos/$REPO/check-runs/$PIN_CHECK" \
            | python3 -c '
          import json,os,sys
          r=json.load(sys.stdin)
          if r.get("head_sha")!=os.environ["PIN_SHA"] or r.get("name")!="SonarCloud Code Analysis" or r.get("output",{}).get("annotations_count")!=2:
              sys.exit("STOP: Sonar check identity changed")
          print("SONAR_PINNED_VERIFIED="+r["head_sha"])
          '
          gh api "/repos/$REPO/check-runs/$PIN_CHECK/annotations?per_page=100" \
            | python3 -c '
          import json,sys
          items=json.load(sys.stdin)
          if len(items)!=2:sys.exit("STOP: expected 2 actual Sonar annotations")
          for i,a in enumerate(items,1):
              print("SONAR_ISSUE_"+str(i)+"="+json.dumps({k:a.get(k) for k in ("path","start_line","annotation_level","title","message","raw_details")},ensure_ascii=False))
          '
