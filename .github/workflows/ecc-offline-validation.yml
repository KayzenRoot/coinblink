name: CoinBlink ECC offline validation (synthetic)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.agents/skills/ecc-*/**'
      - 'tools/benchmarks/ecc-coinblink/**'
      - '.github/workflows/ecc-offline-validation.yml'

# Public-repository runners, no installs, secrets, agents, judges, deploys or external services.
permissions:
  contents: read

jobs:
  python:
    name: ECC offline / Python contracts (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate four skills, 18 NOT_RUN entries and synthetic Python telemetry
        run: python3 -m unittest discover -s tools/benchmarks/ecc-coinblink/validation -p 'test_*.py' -v
      - name: Measure stdlib Python executable-line coverage in synthetic subprocesses
        run: python3 tools/benchmarks/ecc-coinblink/validation/measure_python_coverage.py

  windows:
    name: ECC offline / PowerShell isolation (Windows)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate Python collector on Windows with synthetic fixtures
        shell: pwsh
        run: python -m unittest discover -s tools/benchmarks/ecc-coinblink/validation -p 'test_*.py' -v
      - name: Validate synthetic A/B workspace isolation and quarantine
        shell: pwsh
        run: ./tools/benchmarks/ecc-coinblink/validation/Invoke-OfflineSelfTest.ps1

  sonar_pinned_cache_diagnostic:
    name: ECC diagnostics / read pinned Sonar cache issue
    if: github.event.pull_request.number == 209
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Verify Sonar check identity and disclose one issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: 8a7fc071e4ee2ea14c88f0880391a88e0a392ce3
          CHECK_ID: '120513953087'
        run: |
          set -euo pipefail
          gh api "/repos/$REPOSITORY/check-runs/$CHECK_ID" | python3 -c '
          import json,os,sys
          d=json.load(sys.stdin)
          if d.get("name")!="SonarCloud Code Analysis" or d.get("head_sha")!=os.environ["EXPECTED_HEAD"] or d.get("output",{}).get("annotations_count")!=1:
              sys.exit("STOP: Sonar check identity/annotation count mismatch")
          print("ECC_PINNED_SONAR_CHECK_VERIFIED="+d["head_sha"])
          '
          gh api "/repos/$REPOSITORY/check-runs/$CHECK_ID/annotations?per_page=100" | python3 -c '
          import json,sys
          a=json.load(sys.stdin)
          if len(a)!=1:sys.exit("STOP: exactly one annotation required")
          print("ECC_PINNED_SONAR_ISSUE="+json.dumps({k:a[0].get(k) for k in ("path","start_line","end_line","annotation_level","title","message","raw_details")},ensure_ascii=False,sort_keys=True))
          '
