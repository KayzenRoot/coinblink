name: CoinBlink local integrated journey

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/local-journey-browser.yml"
      - "src/components/LocalJourneyNav.astro"
      - "src/modules/CB-M01/GoldenHome.astro"
      - "src/modules/CB-M02/**"
      - "src/modules/CB-M03/**"
      - "src/modules/CB-M04/**"
      - "e2e/local-journey.spec.mjs"
      - "src/layouts/BaseLayout.astro"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: local-journey-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: Local multi-module Chromium (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Journey and existing module regressions
        run: |
          ./node_modules/.bin/playwright test \
            e2e/local-journey.spec.mjs \
            e2e/m01-official-sources-filter.spec.mjs \
            e2e/m02-news-demo.spec.mjs \
            e2e/m03-source-demo.spec.mjs \
            e2e/m04-market-demo.spec.mjs \
            e2e/m05-admin-prod-guard.spec.mjs
