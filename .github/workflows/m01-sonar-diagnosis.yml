# Temporary read-only diagnostic to expose annotations already published by SonarCloud.
# It does not access Sonar credentials or alter required checks.
name: CoinBlink Sonar annotation diagnosis
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m01-sonar-diagnosis.yml"

permissions:
  contents: read
  checks: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 137
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect already-completed SonarCloud check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'SonarCloud annotations from check 118121039065 (PR 137, audited HEAD 2aea363)'
          gh api --paginate "repos/${GITHUB_REPOSITORY}/check-runs/118121039065/annotations?per_page=100" \
            --jq '.[] | [.annotation_level, .path, (.start_line | tostring), (.end_line | tostring), (.title // ""), (.message // "")] | @tsv'
          echo 'Diagnostic only; do not treat annotations as seven confirmed vulnerabilities.'
