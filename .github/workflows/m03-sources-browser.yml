name: CoinBlink M03 offline provenance acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m03-sources-browser.yml"
      - "src/modules/CB-M03/**"
      - "src/pages/demo/sources.astro"
      - "src/pages/demo/intake.astro"
      - "src/pages/demo/pulse.astro"
      - "src/pages/demo/index.astro"
      - "src/pages/en/news/live.astro"
      - "src/pages/pt-br/news/live.astro"
      - "src/pages/es/news/live.astro"
      - "src/pages/**/news/source/**"
      - "src/pages/*/news/sources.astro"
      - "test/modules/CB-M03/**"
      - "e2e/m03-source-demo.spec.mjs"
      - "e2e/m03-live-news.spec.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: m03-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provenance:
    name: M03 synthetic provenance Node + Chromium (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Source contract tests
        run: node --test test/modules/CB-M03/*.test.mjs
      - name: Build
        run: npm run build
      - name: Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser acceptance
        run: ./node_modules/.bin/playwright test e2e/m03-source-demo.spec.mjs e2e/m03-live-news.spec.mjs
