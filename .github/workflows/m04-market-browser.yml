name: CoinBlink M04 offline market acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m04-market-browser.yml"
      - "src/modules/CB-M04/**"
      - "src/pages/demo/markets.astro"
      - "test/modules/CB-M04/**"
      - "e2e/m04-market-demo.spec.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: m04-markets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  markets:
    name: M04 synthetic markets Node + Chromium (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Market unit tests
        run: node --test test/modules/CB-M04/*.test.mjs
      - name: Build
        run: npm run build
      - name: Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser acceptance
        run: ./node_modules/.bin/playwright test e2e/m04-market-demo.spec.mjs
