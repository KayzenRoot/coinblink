name: CoinBlink M05 local CMS browser regression

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m05-local-cms-browser.yml"
      - "src/modules/CB-M05/**"
      - "test/modules/CB-M05/**"
      - "scripts/dev-studio.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: m05-local-cms-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  local-browser:
    name: M05 synthetic CMS Chromium and D1 (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for local fixture
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Smoke synthetic Owner sign-in and logout
        run: npm run cms:smoke
      - name: Browser regression for local D1, session and unsaved drafts
        run: node --test test/modules/CB-M05/p1c-local-admin-preview.test.mjs test/modules/CB-M05/p1c-local-unsaved-changes.test.mjs
