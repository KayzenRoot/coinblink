name: CoinBlink M06 local Owner dashboard acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m06-local-owner-dashboard.yml"
      - "src/modules/CB-M06/**"
      - "src/modules/CB-M05/p1c-local/local-cms-ui.mjs"
      - "test/modules/CB-M06/**"
      - "test/modules/CB-M05/p1c-local-admin-preview.test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: m06-local-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  local-owner-dashboard:
    name: M06 local Owner DTO + WebAuthn D1 Chromium (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Pure read-only metrics contract
        run: node --test test/modules/CB-M06/owner-dashboard.test.mjs
      - name: Build and no-session-binding guard
        run: npm run build
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: WebAuthn login, real local D1, 401 scrubbing and no egress
        run: node --test test/modules/CB-M05/p1c-local-admin-preview.test.mjs
      - name: Public admin denial regression
        run: ./node_modules/.bin/playwright test e2e/m05-admin-prod-guard.spec.mjs
