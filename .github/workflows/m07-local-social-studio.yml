name: CoinBlink M07 local Social Studio acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m07-local-social-studio.yml"
      - "src/modules/CB-M07/**"
      - "src/modules/CB-M05/p1c-local/local-cms-ui.mjs"
      - "test/modules/CB-M07/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: m07-local-social-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  local-social:
    name: M07 LOCAL social concepts + WebAuthn D1 Chromium (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Node contract and CSP/public route guard
        run: node --test test/modules/CB-M07/social-preview.test.mjs test/modules/CB-M07/local-editorial-variants.test.mjs test/modules/CB-M07/local-editorial-approvals.test.mjs test/modules/CB-M07/x-post-draft.test.mjs
      - name: Build and no-session-binding guard
        run: npm run build
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Local D1 WebAuthn sandbox and revocation
        run: node --test test/modules/CB-M07/local-social-preview.test.mjs
      - name: Public admin remains inaccessible
        run: ./node_modules/.bin/playwright test e2e/m05-admin-prod-guard.spec.mjs
