name: CoinBlink M09 SEO metadata
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m09-seo-metadata.yml"
      - "src/layouts/BaseLayout.astro"
      - "src/modules/CB-M09/**"
      - "test/modules/CB-M09/**"
      - "e2e/m09-seo-metadata.spec.mjs"
      - "docs/product/CB-M09-P1-SEO-METADATA-001.md"
      - ".engineering/evidence/CB-M09-P1-SEO-METADATA-001/**"
permissions:
  contents: read
jobs:
  metadata:
    name: M09 locale metadata Node + Chromium (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Node 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: M09 metadata contracts and the existing Spanish news regression
        run: node --test test/modules/CB-M09/*.test.mjs
      - name: Build Astro
        run: npm run build
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: M09 metadata and the existing Spanish news browser regression
        run: ./node_modules/.bin/playwright test e2e/m09-seo-metadata.spec.mjs e2e/m09-spanish-news.spec.mjs
