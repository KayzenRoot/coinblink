name: CoinBlink M17 local storyboard composer
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m17-local-storyboard.yml"
      - "src/modules/CB-M17/**"
      - "src/pages/demo/storyboard.astro"
      - "test/modules/CB-M17/**"
      - "e2e/m17-local-storyboard.spec.mjs"
      - "docs/product/CB-M17-P0-LOCAL-STORYBOARD-001.md"
      - ".engineering/evidence/CB-M17-P0-LOCAL-STORYBOARD-001/**"
permissions:
  contents: read
jobs:
  safety:
    name: M17 no-media storyboard Node + Chromium (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Node 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: M17 no-media contracts and M03 existing provenance safety
        run: node --test test/modules/CB-M17/*.test.mjs 'test/modules/CB-M03/*.test.mjs'
      - name: Build Astro
        run: npm run build
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: M17 composer and M03 existing provenance browser regression
        run: ./node_modules/.bin/playwright test e2e/m17-local-storyboard.spec.mjs e2e/m03-source-demo.spec.mjs
