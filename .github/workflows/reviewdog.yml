name: CoinBlink reviewdog (ESLint, read-only)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Untrusted PR code receives read permissions only. No pull_request_target,
# privileged event, write token, app secret, deployment or paid API.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: coinblink-reviewdog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eslint:
    name: Reviewdog / ESLint annotations (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout untrusted PR without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Node.js 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Capture ESLint results without an API token
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/eslint . --format json --output-file eslint-results.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "ESLint execution/configuration failed (exit $code)."
            exit "$code"
          fi
          test -f eslint-results.json

      - name: Convert ESLint JSON to safe reviewdog diagnostics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { relative, isAbsolute } from "node:path";

          const results = JSON.parse(readFileSync("eslint-results.json", "utf8"));
          if (!Array.isArray(results)) throw new Error("ESLint JSON must be an array");
          const diagnostics = [];
          for (const file of results) {
            const filePath = relative(process.cwd(), String(file.filePath ?? "")).replaceAll("\\", "/");
            if (!filePath || filePath === ".." || filePath.startsWith("../") || isAbsolute(filePath)) continue;
            for (const msg of file.messages ?? []) {
              if (!Number.isInteger(msg.line) || msg.line < 1) continue;
              const column = Number.isInteger(msg.column) && msg.column > 0 ? msg.column : 1;
              const diagnostic = {
                message: String(msg.message ?? "ESLint finding").replace(/[\r\n]+/g, " ").slice(0, 700),
                location: { path: filePath, range: { start: { line: msg.line, column } } },
                severity: msg.severity === 2 ? "ERROR" : "WARNING",
              };
              if (msg.ruleId) diagnostic.code = { value: String(msg.ruleId).slice(0, 100) };
              diagnostics.push(diagnostic);
            }
          }
          writeFileSync("reviewdog.rdjson", JSON.stringify({ source: { name: "eslint" }, diagnostics }) + "\n");
          console.log("Reviewdog ESLint diagnostics:", diagnostics.length);
          NODE

      - name: Set up pinned reviewdog (no paid service)
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.2

      - name: Report changed-line annotations with read-only token
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          reviewdog -f=rdjson -name=eslint -reporter=github-pr-annotations -filter-mode=added -fail-level=none < reviewdog.rdjson
