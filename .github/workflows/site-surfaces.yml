name: CoinBlink site surfaces sweep
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/site-surfaces.yml"
      - "src/pages/**"
      - "src/layouts/**"
      - "src/modules/**"
      - "src/components/**"
      - "e2e/site-surfaces.spec.mjs"
      - "e2e/link-integrity.spec.mjs"
      - "playwright.config.mjs"
permissions:
  contents: read
jobs:
  surfaces:
    name: All shipped surfaces keep the shared invariants (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Node 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Build Astro
        run: npm run build
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Sweep every surface for language, heading, demo robots, metadata and axe
        run: ./node_modules/.bin/playwright test e2e/site-surfaces.spec.mjs
      - name: Crawl internal links on the seeded surfaces
        run: ./node_modules/.bin/playwright test e2e/link-integrity.spec.mjs
