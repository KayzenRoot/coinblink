# CoinBlink / SonarQube Cloud Automatic Analysis (project-scoped)
# Do not replace this with sonar-project.properties unless analysis is explicitly
# migrated from SonarCloud Automatic Analysis to CI-based scanning.
# https://docs.sonarsource.com/sonarqube-cloud/appendices/troubleshooting/
#
# Exactly one excluded file: an offline-only synthetic SQLite D1 test fixture.
