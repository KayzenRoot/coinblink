<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoinBlink R32 Demo Asset QA</title>
    <style>
      :root { color-scheme: dark light; font-family: system-ui, sans-serif; background: #10151b; color: #f4f6f8; }
      body { margin: 0; padding: 24px; }
      header { max-width: 1120px; margin: 0 auto 24px; }
      h1 { font-size: clamp(1.35rem, 4vw, 2rem); margin: 0 0 8px; }
      p { margin: 0; color: #b8c0c8; }
      main { max-width: 1120px; margin: auto; display: grid; gap: 18px; }
      .asset { border: 1px solid #38434d; border-radius: 12px; overflow: hidden; }
      .asset h2 { font-size: 1rem; margin: 0; padding: 12px 16px; background: #1b242d; }
      .samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; background: #38434d; }
      .surface { padding: 18px; min-width: 0; display: grid; place-content: center; gap: 14px; }
      .surface.dark { background: #111820; color: #f7f9fa; }
      .surface.light { background: #f8fafb; color: #10151b; }
      .row { min-height: 88px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
      img { display: block; object-fit: contain; max-width: 100%; }
      .icon { width: var(--size); height: var(--size); }
      .horizontal { height: var(--size); width: auto; }
      .stacked { height: var(--size); width: auto; }
      .label { font-size: 12px; opacity: .75; text-align: center; }
      .status { padding: 12px; border-radius: 8px; background: #1b242d; }
      @media (max-width: 560px) { body { padding: 14px; } .samples { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>CoinBlink R32 Demo Asset QA</h1>
      <p>Isolated visual harness. This page does not alter the site header, favicon, or application routes.</p>
    </header>
    <main id="assets"></main>
    <script>
      const sources = [
        { file: "coinblink-symbol.svg", label: "CoinBlink symbol", kind: "icon" },
        { file: "coinblink-horizontal-dark.svg", label: "CoinBlink horizontal dark", kind: "horizontal", surface: "dark" },
        { file: "coinblink-horizontal-light.svg", label: "CoinBlink horizontal light", kind: "horizontal", surface: "light" },
        { file: "coinblink-stacked.svg", label: "CoinBlink stacked mark", kind: "stacked" },
        { file: "favicon.svg", label: "CoinBlink favicon proposal", kind: "icon" },
      ];
      const sizes = { icon: [32, 48, 96, 128, 256, 512], horizontal: [32, 48, 96, 128], stacked: [64, 128, 256] };
      const root = document.querySelector("#assets");
      for (const asset of sources) {
        const section = document.createElement("section");
        section.className = "asset";
        section.dataset.asset = asset.file;
        const title = document.createElement("h2");
        title.textContent = asset.label;
        section.append(title);
        const samples = document.createElement("div");
        samples.className = "samples";
        const surfaces = asset.surface ? [asset.surface] : ["dark", "light"];
        for (const surface of surfaces) {
          const panel = document.createElement("div");
          panel.className = "surface " + surface;
          panel.setAttribute("aria-label", surface + " surface preview");
          const row = document.createElement("div");
          row.className = "row";
          for (const size of sizes[asset.kind]) {
            const wrapper = document.createElement("div");
            wrapper.className = "sample";
            wrapper.style.setProperty("--size", size + "px");
            const image = document.createElement("img");
            image.src = "/brand/" + asset.file;
            image.alt = asset.label + ", " + surface + " background, " + size + " pixels";
            image.className = asset.kind;
            image.dataset.size = String(size);
            wrapper.append(image);
            const label = document.createElement("div");
            label.className = "label";
            label.textContent = size + " px";
            wrapper.append(label);
            row.append(wrapper);
          }
          panel.append(row);
          samples.append(panel);
        }
        section.append(samples);
        root.append(section);
      }
      window.qaReady = true;
    </script>
  </body>
</html>
